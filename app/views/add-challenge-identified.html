{% extends "layouts/main.html" %}

{% block pageTitle %}How was this challenge identified?{% endblock %}

{% block content %}
<div class="govuk-width-container">

  <a class="govuk-back-link" href="/add-challenge-category">Back</a>

  <p class="govuk-caption-xl">Add a challenge and support</p>

  <h1 class="govuk-heading-xl" style="margin-bottom: 0.25rem;">
    How was this challenge identified?
  </h1>

  <p class="govuk-hint" style="margin: 0 0 0.75rem 0;">
    Select all that apply
  </p>

  <!-- ✅ ✅ ✅ FIXED ROUTE (CRITICAL CHANGE) -->
  <form action="/add-challenge-identified" method="post">

    <fieldset class="govuk-fieldset govuk-form-group">
      <div class="govuk-checkboxes govuk-checkboxes--small">

        <!-- ✅ HUMAN-READABLE VALUES -->
        <div class="govuk-checkboxes__item">
          <input class="govuk-checkboxes__input"
                 id="observed-education"
                 name="identified-by"
                 type="checkbox"
                 value="Observed in education, skills and work">
          <label class="govuk-label govuk-checkboxes__label" for="observed-education">
            Observed in education, skills and work
          </label>
        </div>

        <div class="govuk-checkboxes__item">
          <input class="govuk-checkboxes__input"
                 id="observed-prison"
                 name="identified-by"
                 type="checkbox"
                 value="Observed in the wider prison">
          <label class="govuk-label govuk-checkboxes__label" for="observed-prison">
            Observed in the wider prison
          </label>
        </div>

        <div class="govuk-checkboxes__item">
          <input class="govuk-checkboxes__input"
                 id="self-disclosure"
                 name="identified-by"
                 type="checkbox"
                 value="Self-disclosure by the individual">
          <label class="govuk-label govuk-checkboxes__label" for="self-disclosure">
            Self-disclosure by the individual
          </label>
        </div>

        <div class="govuk-checkboxes__item">
          <input class="govuk-checkboxes__input"
                 id="formal-processes"
                 name="identified-by"
                 type="checkbox"
                 value="Formal assessment or referral">
          <label class="govuk-label govuk-checkboxes__label" for="formal-processes">
            Formal assessment or referral
          </label>
        </div>

        <!-- ✅ OTHER OPTION -->
        <div class="govuk-checkboxes__item">
          <input class="govuk-checkboxes__input"
                 id="identified-other"
                 name="identified-by"
                 type="checkbox"
                 value="Other"
                 aria-controls="other-details-conditional"
                 aria-expanded="false">
          <label class="govuk-label govuk-checkboxes__label" for="identified-other">
            Other
          </label>
        </div>

      </div>
    </fieldset>

    <!-- ✅ CONDITIONAL INPUT -->
    <div id="other-details-conditional" class="govuk-checkboxes__conditional govuk-!-margin-bottom-5" hidden>
      <div class="govuk-form-group">
        <label class="govuk-label" for="other-details">
          Add details
        </label>
        <input class="govuk-input govuk-input--width-20"
               id="other-details"
               name="other-details"
               type="text">
      </div>
    </div>

    <button class="govuk-button">Save to profile</button>

  </form>

  <!-- ✅ SHOW/HIDE SCRIPT -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const checkbox = document.getElementById('identified-other')
      const conditional = document.getElementById('other-details-conditional')

      function toggle() {
        conditional.hidden = !checkbox.checked
        checkbox.setAttribute('aria-expanded', checkbox.checked)
      }

      checkbox.addEventListener('change', toggle)
      toggle()
    })
  </script>

</div>
{% endblock %}
